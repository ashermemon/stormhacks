<!doctype html><html><head><meta charset="UTF-8"><style>body{margin:0}</style></head><body><script type="module">
import * as THREE from "three";
import { createEnvironment } from "/src/environment.js";
import { SUN_DIRECTION, LIGHT_DIRECTION } from "/src/atmosphere.js";
import { loadWorld } from "/src/world.js";
import { applyToonWater } from "/src/watershader.js";
import { setToonLight, toonifyScene } from "/src/toonshading.js";
const scene = new THREE.Scene();
const env = createEnvironment(scene);
const world = await loadWorld(); applyToonWater(world.root); scene.add(world.root);
setToonLight(LIGHT_DIRECTION.x, LIGHT_DIRECTION.y, LIGHT_DIRECTION.z); toonifyScene(scene);
const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 600);
camera.position.set(12, world.getGroundHeight(12, 5) + 4, 5);
const d = SUN_DIRECTION.clone(); d.y = 0.08;
camera.lookAt(camera.position.clone().addScaledVector(d.normalize(), 100));
const r = new THREE.WebGLRenderer({ antialias: true, stencil: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
let f = 0; r.setAnimationLoop(() => { env.update(camera, 0); r.render(scene, camera); if (++f === 90) console.log("PREVIEW ok"); });
window.onerror = (e) => console.log("PREVIEW ERROR", e);
</script></body></html>
